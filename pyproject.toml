[project]
name = "vmd"
version = "0.1.0"
description = "Video motion detection with AI verification"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "PySide6>=6.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vmd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
