[project]
name = "vmd"
version = "0.1.0"
description = "Video motion detection with AI verification"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "PySide6>=6.6",
    "python-vlc>=3.0.21203",
]

# The detector stack, declared rather than hand-installed. It was previously
# only ever installed ad-hoc, which meant any `uv sync` silently removed it and
# broke every tool in spike/. It is an extra because it drags in torch, and the
# recording service runs perfectly well without it.
[project.optional-dependencies]
detect = ["ultralytics>=8.3"]

[project.scripts]
vmd-record = "vmd.record_main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vmd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: spawns real external processes; slow. Skip with -m 'not integration'",
]

# No test may hang. Three mutations have already wedged this suite instead of
# failing it, and each time only that one mutation was fixed - never the reason a
# test *can* hang. A suite that stops at 3 a.m. on an unattended machine tells
# nobody anything; one that fails prints a stack trace naming the line.
#
# 30 seconds against a unit suite whose slowest individual test is a few seconds
# is roughly ten times the worst honest case, which is the point: this is a
# deadlock detector, not a performance budget. The integration tests legitimately
# spawn go2rtc and ffmpeg and record real clips in real time - the acceptance
# test is about half a minute on its own - so `tests/conftest.py` raises the
# ceiling for anything marked `integration` rather than letting 30 s fail them.
#
# `thread` is the only method available on Windows, which is the machine this
# runs on: SIGALRM does not exist there.
timeout = 30
timeout_method = "thread"
